<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Greatbeing 做的东西</title>
<meta name="description" content="Greatbeing 的项目总目录：每个项目讲什么、怎么拿到、凭什么信。每晚从 GitHub 自动生成。">
<style>
  :root{
    --paper:#eef2ec; --ink:#16211c; --muted:#5c6b63; --rule:#c3cec4; --soft:#dde5dc;
    --ok:#1b6b45; --warn:#9a5b06; --none:#6e7a74;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Mono","Consolas","SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--paper);color:var(--ink);font:16px/1.7 var(--sans);-webkit-text-size-adjust:100%}
  body{margin:0;padding:0 24px 80px}
  main{max-width:1080px;margin:0 auto}
  a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .num{font-variant-numeric:tabular-nums}

  header{padding:56px 0 28px}
  h1{margin:0;font-size:clamp(28px,5vw,44px);line-height:1.2;font-weight:700;letter-spacing:-.01em}
  .lede{margin:14px 0 0;max-width:38em;color:var(--muted)}
  .tagline{margin:10px 0 0;max-width:38em}
  .contact{margin:10px 0 0;max-width:38em}
  .contact:empty,.tagline:empty{display:none}

  .note{display:grid;grid-template-columns:repeat(4,auto);gap:6px 32px;justify-content:start;margin:28px 0 0;padding:14px 0;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}
  .note b{display:block;font-size:28px;line-height:1.1;font-weight:700}
  .note span{font-size:14px;color:var(--muted)}

  h2{margin:36px 0 0;font-size:20px;font-weight:700}
  h2 small{font-weight:400;color:var(--muted);margin-left:10px;font-size:15px}

  /* 对账单：表头双线，行间单线 */
  .ledger{width:100%;border-collapse:collapse;margin-top:10px;border-top:3px double var(--ink)}
  .ledger th{text-align:left;font-weight:600;color:var(--muted);font-size:14px;padding:12px 16px 8px 0;border-bottom:1px solid var(--ink);vertical-align:bottom}
  .ledger td{padding:18px 16px 18px 0;border-bottom:1px solid var(--rule);vertical-align:top}
  .ledger tr:last-child td{border-bottom:3px double var(--ink)}
  .ledger col.c-name{width:17%}.ledger col.c-what{width:26%}.ledger col.c-how{width:35%}.ledger col.c-why{width:22%}
  .name{font-size:18px;font-weight:700;line-height:1.35}
  .name a{text-decoration:none}
  .name a:hover{text-decoration:underline}
  .meta{margin-top:6px;color:var(--muted);font-size:14px}
  .nw{white-space:nowrap}
  .what{margin:0}
  .how p{margin:0 0 8px}
  .excerpt{font-size:14px;line-height:1.65;white-space:pre-line;overflow-wrap:anywhere}
  .kind{display:inline-block;padding:1px 8px;border-radius:3px;font-size:14px;font-weight:600}
  .kind-paid{background:var(--ink);color:var(--paper)}
  .kind-skill{border:1.5px solid var(--ink)}
  .kind-open{border:1px solid var(--rule);color:var(--muted)}
  details{margin-top:4px}
  summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none;display:inline-block;border-bottom:1px solid var(--rule)}
  summary::-webkit-details-marker{display:none}
  summary:hover{color:var(--ink);border-color:var(--ink)}
  pre{margin:10px 0 0;padding:12px 14px;background:#fff;border:1px solid var(--soft);white-space:pre-wrap;word-break:break-all;font:13px/1.6 var(--mono)}
  .why ul{margin:0;padding:0;list-style:none;font-size:14px;line-height:1.6}
  .why li{padding-left:14px;position:relative}
  .why li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--none)}
  .why .ok::before{background:var(--ok)} .why .warn::before{background:var(--warn)}
  .why a{text-decoration:none;border-bottom:1px solid var(--rule)}
  .why a:hover{border-color:var(--ink)}

  .state{padding:80px 0;text-align:center;color:var(--muted)}
  .state code{font:14px var(--mono)}

  footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--rule);color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 28px}

  @media (max-width:760px){
    body{padding:0 16px 56px}
    .note{grid-template-columns:repeat(2,auto)}
    .ledger,.ledger tbody,.ledger tr,.ledger td{display:block;width:auto}
    .ledger thead{display:none}
    .ledger tr{padding:20px 0;border-bottom:1px solid var(--rule)}
    .ledger tr:last-child{border-bottom:3px double var(--ink)}
    .ledger td{border:0;padding:6px 0}
    .ledger td[data-label]::before{content:attr(data-label);display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
    .ledger td.c-name::before{content:none}
  }
  @media (prefers-reduced-motion:no-preference){
    details[open] pre{animation:drop .18s ease-out}
    @keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#151b18;--ink:#e3eae4;--muted:#9fb0a6;--rule:#33403a;--soft:#263029;--ok:#62c794;--warn:#e0a24a;--none:#88958e}
    .kind-paid{background:#e3eae4;color:#151b18}
    pre{background:#1b231f}
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Greatbeing 做的东西</h1>
    <p class="lede">这一页每晚从 GitHub 自动生成，没有一句手写介绍。最后一栏写的是每个项目凭什么可以信：有就写有，没跑就写没跑。</p>
    <p class="tagline" id="tagline"></p>
    <p class="contact" id="contact"></p>
    <div class="note num" id="note" hidden></div>
  </header>

  <div id="content"><p class="state">正在读取目录数据…</p></div>

  <footer>
    <span id="generated"></span>
    <span>数据来自 GitHub 公开接口，每个条目都能点回原仓库核对。</span>
    <a id="profile" href="https://github.com/Greatbeing" rel="noopener">GitHub 主页</a>
    <a href="llms.txt">给程序读的版本（llms.txt）</a>
  </footer>
</main>

<!--INJECT_PF_DATA-->
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const day = (iso) => iso.slice(0, 10);
  const fmt = (iso) => new Date(iso).toLocaleString('zh-CN', { hour12: false });

  let cfg, data;
  if (window.__PF__) {
    cfg = window.__PF__.config || {};
    data = window.__PF__.data || { repos: [] };
  } else try {
    [cfg, data] = await Promise.all([
      fetch('data/portfolio.config.json').then((r) => { if (!r.ok) throw new Error('portfolio.config.json ' + r.status); return r.json(); }),
      fetch('data/portfolio_index.json').then((r) => { if (!r.ok) throw new Error('portfolio_index.json ' + r.status); return r.json(); })
    ]);
  } catch (err) {
    $('content').innerHTML = '<p class="state">目录数据没有读到，页面暂时是空的。重新生成一次：<code>node scripts/build-index.mjs</code><br>' + esc(err.message) + '</p>';
    return;
  }

  $('title').textContent = cfg.title || 'Greatbeing 做的东西';
  document.title = cfg.title || 'Greatbeing 做的东西';
  $('tagline').textContent = cfg.tagline || '';
  if (cfg.contact) { $('contact').textContent = cfg.contact; }

  const repos = data.repos || [];
  const count = (re) => repos.filter((r) => re.test(r.tags.join(' '))).length;
  $('note').hidden = false;
  $('note').innerHTML = [
    [repos.length, '个项目'],
    [count(/paid/), '可以直接付费使用'],
    [count(/skill/), '可以免费安装的 skill'],
    [repos.filter((r) => r.evidence.eval && r.evidence.eval.ran === 'filled').length, '个有效果对照数据']
  ].map(([n, label]) => '<div><b>' + n + '</b><span>' + label + '</span></div>').join('');

  const KIND = { paid: '付费使用', skill: '免费安装', open: '开源' };
  function why(r) {
    const e = r.evidence, li = [];
    li.push(e.tests > 0
      ? '<li class="ok">有测试，' + e.tests + ' 个文件</li>'
      : '<li>没有测试文件</li>');
    li.push(e.eval
      ? (e.eval.ran === 'filled' ? '<li class="ok"><a href="' + esc(e.eval.url) + '" rel="noopener">效果对照已跑出结果</a></li>'
        : e.eval.ran === 'unfilled' ? '<li class="warn"><a href="' + esc(e.eval.url) + '" rel="noopener">搭了效果对照，还没跑</a></li>'
        : '<li>有效果对照文件，状态未知</li>')
      : '<li>没有效果对照</li>');
    li.push(e.ci === 'success' ? '<li class="ok"><a href="' + esc(e.ci_url) + '" rel="noopener">最近一次 CI 通过</a></li>'
      : e.ci === 'failure' ? '<li class="warn"><a href="' + esc(e.ci_url) + '" rel="noopener">最近一次 CI 失败</a></li>'
      : '<li>没有 CI 记录</li>');
    return '<ul>' + li.join('') + '</ul>';
  }
  function how(r) {
    const kind = r.tags.includes('paid') ? 'paid' : r.tags.includes('skill') ? 'skill' : 'open';
    let html = '<p><span class="kind kind-' + kind + '">' + KIND[kind] + '</span></p>';
    if (r.homepage) html += '<p><a href="' + esc(r.homepage) + '" rel="noopener">' + esc(r.homepage.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</a></p>';
    // 「怎么拿到」小节的原文说明直接摆出来——付费项目这一格就是端点和价格，不能藏在折叠里。
    if (r.use && r.use.text) html += '<p class="excerpt">' + esc(r.use.text) + '</p>';
    if (r.use && r.use.code) {
      html += '<details><summary>安装命令，摘自 README</summary><pre>' + esc(r.use.code) + '</pre></details>';
    }
    if (!r.use && !r.homepage) {
      html += '<p>用法见仓库说明。</p>';
    }
    return html;
  }
  function row(r) {
    return '<tr>'
      + '<td class="c-name"><div class="name"><a href="' + esc(r.url) + '" rel="noopener">' + esc(r.name) + '</a></div>'
      + '<div class="meta num">' + r.stars + ' 星，最近更新 <span class="nw">' + day(r.pushed_at) + '</span></div></td>'
      + '<td class="c-what" data-label="给你什么"><p class="what">' + esc(r.what || '这个仓库还没有写说明。') + '</p></td>'
      + '<td class="c-how" data-label="怎么拿到">' + how(r) + '</td>'
      + '<td class="c-why" data-label="凭什么信">' + why(r) + '</td>'
      + '</tr>';
  }
  const rank = (r) => (r.tags.includes('paid') ? 0 : r.tags.includes('skill') ? 1 : 2);
  const table = (list) => '<table class="ledger"><colgroup><col class="c-name"><col class="c-what"><col class="c-how"><col class="c-why"></colgroup>'
    + '<thead><tr><th>项目</th><th>给你什么</th><th>怎么拿到</th><th>凭什么信</th></tr></thead><tbody>'
    + list.sort((a, b) => rank(a) - rank(b) || b.stars - a.stars).map(row).join('') + '</tbody></table>';

  const GROUPS = [['active', '还在更新的项目'], ['list', '整理的清单'], ['early', '早期的实验，不再维护']];
  let html = '';
  for (const [key, label] of GROUPS) {
    const list = repos.filter((r) => r.group === key);
    if (!list.length) continue;
    html += '<section><h2>' + label + '<small>' + list.length + ' 个</small></h2>' + table(list) + '</section>';
  }
  $('content').innerHTML = html || '<p class="state">目录是空的。先运行 <code>node scripts/build-index.mjs</code> 生成一次。</p>';
  $('generated').textContent = '生成于 ' + fmt(data.generatedAt) + '。';
})();
</script>
</body>
</html>
