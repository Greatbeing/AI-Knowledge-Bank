services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - .env.oracle
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Keep the app private on the VM until host-level TLS/reverse proxy is set up.
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    networks:
      - app-internal

networks:
  app-internal:
    driver: bridge
