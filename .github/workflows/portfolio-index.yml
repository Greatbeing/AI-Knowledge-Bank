name: portfolio-index

# 每晚从 GitHub 重新生成作品集目录（data/portfolio_index.json 与 llms.txt）。
# 没有手写条目，所以不需要人来维护；有变化就提交，没变化就什么都不做。
on:
  schedule:
    - cron: '17 19 * * *' # 北京时间每天 03:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-index.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/portfolio_index.json llms.txt; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio_index.json llms.txt
          git commit -m "chore: regenerate portfolio index"
          git push
