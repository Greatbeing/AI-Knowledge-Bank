name: Pull Request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check text health
        run: npm run check:text

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify read-only capability catalog import
        run: |
          node scripts/phase1-import.mjs --out /tmp/phase1-capability-catalog.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const catalog = JSON.parse(await readFile("/tmp/phase1-capability-catalog.json", "utf8"));
          const { report } = catalog;
          console.log(JSON.stringify(report, null, 2));
          if (report.duplicate_ids.length) throw new Error("Duplicate catalog IDs detected");
          if (report.validation_errors.length) throw new Error("Manifest validation errors detected");
          if (report.engine_count < 15) throw new Error("Expected at least 15 writing engines");
          if (report.imported_domain_primitive_count < 170) throw new Error("Expected at least 170 domain primitives");
          if (report.imported_general_primitive_count !== 4) throw new Error("Expected 4 general primitives");
          if (report.record_count < 190) throw new Error("Catalog record count unexpectedly low");
          NODE

      - name: Build
        run: npm run build

      - name: Verify build output
        run: npm run check:dist
