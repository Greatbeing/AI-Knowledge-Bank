<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>贡献与审核 · AI Knowledge Bank（本地）</title>
<style>
  :root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--ok:#1a7f37;--warn:#b26a00;--bad:#b42318}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--blue)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}
  header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.7);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
  .brand{font-weight:600;font-size:15px}.brand span{color:var(--sub);font-weight:400}
  .home{font-size:13px}
  main{padding:34px 0 60px}
  h1{font-size:clamp(26px,3.6vw,36px);font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
  .lead{color:var(--sub);margin:0 0 22px}
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 26px;color:var(--sub);font-size:14px}
  .stats b{color:var(--ink);font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .card h2{font-size:16px;font-weight:600;margin:0 0 14px}
  label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:86px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(0,113,227,.35);border-color:var(--blue)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button{cursor:pointer;font:inherit;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px}
  button:hover{border-color:#b9b9be}
  .primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .primary:hover{background:#0077ed}
  .primary:disabled{opacity:.5;cursor:default}
  .ok{background:#e9f7ee;border-color:#bfe3c9;color:var(--ok)}
  .bad{background:#fdecea;border-color:#f5c6c0;color:var(--bad)}
  .msg{font-size:13px;margin-top:10px;min-height:18px}.msg.err{color:var(--bad)}.msg.good{color:var(--ok)}
  .pending{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .pending li{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fbfbfd}
  .pending .t{font-weight:600;margin:0 0 4px}
  .pending .s{color:var(--sub);font-size:13.5px;margin:0 0 8px}
  .pending .m{font-size:12px;color:var(--sub);margin:0 0 8px}
  .pending .acts{display:flex;gap:8px}
  .empty{color:var(--sub);font-size:14px}
  .tip{font-size:12.5px;color:var(--sub);margin-top:14px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">AI Knowledge Bank <span>/ 贡献与审核（本地数据层）</span></div>
  <a class="home" href="./">← 返回站点</a>
</div></header>

<main class="wrap">
  <h1>提交知识，审核入库</h1>
  <p class="lead">本地数据层：提交的节点进入 <code>pending</code>，审核通过后变成 <code>validated</code> 并进入公开三库，同时累加真实 validation 计数。</p>
  <div class="stats" id="stats"><span>加载中…</span></div>

  <div class="grid">
    <section class="card">
      <h2>提交新节点</h2>
      <form id="form">
        <div class="row">
          <div><label>库类型</label>
            <select id="vault_type">
              <option value="knowledge">知识库（原则/方法）</option>
              <option value="tool">工具库（可复用工具）</option>
              <option value="case">案例库（真实案例）</option>
            </select>
          </div>
          <div><label>语言</label>
            <select id="language"><option value="zh">中文</option><option value="en">English</option></select>
          </div>
        </div>
        <label>标题</label><input id="title" maxlength="160" placeholder="一句话说清这条知识" />
        <label>摘要</label><textarea id="summary" maxlength="1200" placeholder="可核的事实与做法；不要写没有出处的判断"></textarea>
        <label>推荐理由（可选）</label><input id="reason" maxlength="300" placeholder="为什么它值得被复用" />
        <div class="row">
          <div><label>场景标签（逗号分隔）</label><input id="tags" placeholder="方法, 可靠性" /></div>
          <div><label>出处引用（逗号分隔）</label><input id="refs" placeholder="AI-Knowledge-Bank/DEVELOPMENT.md" /></div>
        </div>
        <div style="margin-top:16px"><button class="primary" id="submit" type="submit">提交（进入 pending）</button></div>
        <div class="msg" id="msg"></div>
      </form>
      <p class="tip">提示：接口 <code>POST /api/nodes</code>；审核 <code>POST /api/nodes/:id/validate</code>。仅本地可用。</p>
    </section>

    <section class="card">
      <h2>待审核（pending）</h2>
      <ul class="pending" id="pending"><li class="empty">加载中…</li></ul>
    </section>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const msg = (t, ok) => { $('msg').textContent = t || ''; $('msg').className = 'msg ' + (ok ? 'good' : 'err'); };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function loadStats() {
    try {
      const r = await fetch('/api/vaults?locale=zh');
      const d = await r.json();
      const s = d.stats || {};
      $('stats').innerHTML = `<span>知识库 <b>${s.knowledge || 0}</b></span><span>工具库 <b>${s.tools || 0}</b></span><span>案例库 <b>${s.cases || 0}</b></span><span>数据源 <b>${esc(d.source || '?')}</b></span>`;
    } catch { $('stats').innerHTML = '<span>数据服务未启动（先运行 npm run dev:local）</span>'; }
  }

  async function loadPending() {
    const ul = $('pending');
    try {
      const r = await fetch('/api/nodes?status=pending');
      const d = await r.json();
      const list = d.nodes || [];
      if (!list.length) { ul.innerHTML = '<li class="empty">暂无待审核节点。提交一条试试。</li>'; return; }
      ul.innerHTML = list.map((n) => `
        <li data-id="${esc(n.id)}">
          <p class="t">${esc(n.title)}</p>
          <p class="s">${esc(n.summary).slice(0, 140)}</p>
          <p class="m">${esc(n.vault_type)} · ${esc(n.status)} · ${n.validation_count || 0} 次验证</p>
          <div class="acts">
            <button class="ok" data-act="approve">通过 ✓</button>
            <button class="bad" data-act="reject">驳回 ✕</button>
          </div>
        </li>`).join('');
    } catch { ul.innerHTML = '<li class="empty">读取失败（数据服务未启动？）</li>'; }
  }

  async function review(id, decision) {
    try {
      const r = await fetch(`/api/nodes/${encodeURIComponent(id)}/validate`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ decision, actor: 'reviewer' })
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'fail');
      msg(decision === 'approve' ? `已通过：${d.node.title}` : `已驳回：${d.node.title}`, decision === 'approve');
      await Promise.all([loadStats(), loadPending()]);
    } catch (e) { msg('审核失败：' + e.message, false); }
  }

  $('pending').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const id = b.closest('li')?.dataset.id;
    review(id, b.dataset.act === 'approve' ? 'approve' : 'reject');
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      vault_type: $('vault_type').value,
      title: $('title').value.trim(),
      summary: $('summary').value.trim(),
      recommendation_reason: $('reason').value.trim(),
      scenario_tags: $('tags').value.split(',').map((s) => s.trim()).filter(Boolean),
      source_refs: $('refs').value.split(',').map((s) => s.trim()).filter(Boolean),
      language: $('language').value
    };
    if (!body.title || !body.summary) { msg('标题和摘要必填', false); return; }
    $('submit').disabled = true;
    try {
      const r = await fetch('/api/nodes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'fail');
      msg('已提交，进入待审核。', true);
      $('title').value = ''; $('summary').value = ''; $('reason').value = ''; $('tags').value = ''; $('refs').value = '';
      await loadPending();
    } catch (e) { msg('提交失败：' + e.message, false); }
    finally { $('submit').disabled = false; }
  });

  loadStats(); loadPending();
</script>
</body>
</html>
